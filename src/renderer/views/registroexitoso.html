<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud enviada</title>
    <link rel="stylesheet" href="../css/stylesregistroexitoso.css">
    <link rel="stylesheet" href="../../../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
</head>

<body>
    <div class="layout">
        <div class="success-card">
            <h1>¡Solicitud enviada!</h1>
            <hr class="divider-line">
            <div class="success-message">
                <p>Se enviaron los Términos y Condiciones al correo del usuario.</p>
                <p class="nota">El registro se completará cuando los acepte y recibirá su código QR por correo. Verás el resultado en Notificaciones.</p>
            </div>
            <button id="btn-volver-qr-sccs" class="accept-button">Aceptar</button>
        </div>
    </div>
    <script src="../js/registroexitoso.js"></script>
</body>

</html>
