<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Acceso</title>
    <link rel="stylesheet" href="../css/stylesacceder.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="layout">
        <div class="backgroundwhite">
            <img src="../assets/backgroundwhite.png" alt="Decoración superior">
        </div>

        <main class="container">
            <div class="access-options">
                <!-- Opción 1: Código QR -->
                <div class="access-card" id="visitante-frecuente">
                    <div class="card-icon">
                        <img src="../assets/frecuente.png">
                    </div>
                    <div class="card-content">
                        <h2>Visitante Frecuente</h2>
                        <p>Visitante no perteneciente a la universidad con acceso frecuentes</p>
                    </div>
                </div>

                <div class="access-card" id="visitante-temporal">
                    <div class="card-icon">
                        <img src="../assets/guesttemporal.png">
                    </div>
                    <div class="card-content">
                        <h2>Visitante Temporal</h2>
                        <p>Visitante no perteneciente a la univerisdad con accesos temporales</p>
                    </div>
                </div>
            </div>

            <button id="btn-volver-accs" class="back-button">
                Regresar
            </button>
        </main>

        <div class="backgroundwhite-bottom">
            <img src="../assets/backgroundwhite-bottom.png" alt="Decoración inferior">
        </div>
    </div>

    <script src="../js/registrovisitantes.js"></script>
</body>

</html>
