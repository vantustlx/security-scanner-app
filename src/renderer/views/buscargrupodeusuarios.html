<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Búsqueda de Grupo de Usuarios</title>
    <link rel="stylesheet" href="../css/stylesbuscargrupodeusuarios.css">
    <link rel="stylesheet" href="../../../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="../assets/logo.png" alt="Logo" class="logo">
            <h1>BUSQUEDA DE GRUPOS DE USUARIOS ACTIVOS</h1>
        </div>

        <div class="formulario-filtros">
            <div class="campo">
                <label for="area">Área</label>
                <select id="area" name="area"></select>
            </div>

            <div class="campo">
                <label for="carrera">Carrera</label>
                <select id="carrera" name="carrera"></select>
            </div>

            <div class="campo">
                <label for="turno">Turno</label>
                <select id="turno" name="turno"></select>
            </div>

            <div class="campo boton-buscar">
                <button class="btn btn-buscar">Buscar</button>
            </div>
        </div>

        <div class="list-section">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido paterno</th>
                        <th>Apellido materno</th>
                        <th>Matrícula</th>
                        <th>Teléfono</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Aquí van los resultados -->
                </tbody>
            </table>
        </div>
    </div>

    <button class="btn btn-regresar" id="btn-regresar">Regresar</button>
    <script src="../js/ui.js"></script>
    <script src="../js/areasUsuario.js"></script>
    <script src="../js/buscargrupodeusuarios.js"></script>
</body>
</html>
