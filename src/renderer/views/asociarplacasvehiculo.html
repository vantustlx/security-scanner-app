<!DOCTYPE html> 
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asociar Placas de Vehículo</title>
    <link rel="stylesheet" href="../css/stylesasociarplacasvehiculo.css">
    <link rel="stylesheet" href="../../../node_modules/@fontsource/ubuntu/400.css">
    <link rel="stylesheet" href="../../../node_modules/@fontsource/ubuntu/500.css">
</head>

<body>
    <div class="layout">
        <div class="backgroundwhite">
            <img src="../assets/backgroundwhite.png" alt="Decoración superior">
        </div>

        <main class="container">
            <div class="registro">
                <h1>Busqueda de usuario</h1>
                <form class="formulario" method="POST" action="#">

                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="campo">
                        <label for="apellidoP">Apellido paterno</label>
                        <input type="text" id="apellidoP" name="apellidoP" required>
                    </div>

                    <div class="campo">
                        <label for="apellidoM">Apellido materno</label>
                        <input type="text" id="apellidoM" name="apellidoM" required>
                    </div>

                    <div class="campo">
                        <label for="matricula">Matrícula / Número de trabajador</label>
                        <input type="text" id="matricula" name="matricula" required>
                    </div>

                    <div class="campo">
                        <label for="correo">Correo</label>
                        <input type="text" id="correo" name="correo">
                    </div>


                    <div class="botones">
                        <button type="button" class="btn-rojo" id="boton-rojo">Regresar</button>
                        <button type="button" class="btn-verde" id="boton-verde">Buscar</button>
                    </div>
                </form>

                <!-- Coincidencias mientras se escribe: al elegir una fila se abren sus placas -->
                <div class="resultados" id="resultados" hidden>
                    <p class="resultados-titulo" id="resultados-titulo"></p>
                    <div class="tabla-resultados">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Matrícula</th>
                                    <th>Correo</th>
                                    <th>Placas</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-usuarios"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <div class="backgroundwhite-bottom">
            <img src="../assets/backgroundwhite-bottom.png" alt="Decoración inferior">
        </div>

        <!-- Placas del usuario elegido: agregar, cambiar y quitar -->
        <div class="modal-overlay2" id="modal-placas">
            <div class="modal-content modal-placas" role="dialog" aria-modal="true" aria-labelledby="placas-titulo">
                <h2 id="placas-titulo">Placas del usuario</h2>
                <p class="placas-usuario" id="placas-usuario"></p>
                <ul class="lista-placas" id="lista-placas"></ul>

                <div class="campoplaca">
                    <label for="placa" id="etiqueta-placa">Agregar placa</label>
                    <input type="text" id="placa" name="placa" placeholder="ABC-123-D" maxlength="9">
                    <div id="error-placa" class="mensaje-error" style="display: none;"></div>
                </div>

                <div class="modal-acciones">
                    <button type="button" class="modal-btn secundario" id="btn-cancelar-edicion" hidden>Cancelar cambio</button>
                    <button type="button" class="modal-btn" id="btn-guardar-placa">Agregar</button>
                    <button type="button" class="modal-btn secundario" id="btn-cerrar-placas">Cerrar</button>
                </div>
            </div>
        </div>

        <!-- Script para asegurar que la onda inferior se muestre correctamente -->
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                // Asegurar que el layout tenga altura completa
                const layout = document.querySelector('.layout');
                const vh = window.innerHeight;
                layout.style.minHeight = vh + 'px';

                // Asegurar que la onda inferior sea visible
                const bottomWave = document.querySelector('.backgroundwhite-bottom');
                bottomWave.style.display = 'block';
            });
        </script>
    </div>
    <script src="../js/ui.js"></script>
    <script src="../js/asociarplacasvehiculo.js"></script>
</body>

</html>
