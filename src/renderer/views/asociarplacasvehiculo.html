<!DOCTYPE html> 
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../css/stylesasociarplacasvehiculo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <div class="layout">
        <div class="backgroundwhite">
            <img src="../assets/backgroundwhite.png" alt="Decoración superior">
        </div>

        <main class="container">
            <div class="registro">
                <h1>Busqueda de usuario</h1>
                <form class="formulario" method="POST" action="#">

                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="campo">
                        <label for="apellidoP">Apellido paterno</label>
                        <input type="text" id="apellidoP" name="apellidoP" required>
                    </div>

                    <div class="campo">
                        <label for="apellidoM">Apellido materno</label>
                        <input type="text" id="apellidoM" name="apellidoM" required>
                    </div>

                    <div class="campo">
                        <label for="matricula">Matrícula / Número de trabajador</label>
                        <input type="text" id="matricula" name="matricula" required>
                    </div>


                    <div class="botones">
                        <button type="button" class="btn-rojo" id="boton-rojo">Regresar</button>
                        <button type="button" class="btn-verde" id="boton-verde">Buscar</button>
                    </div>
                </form>
            </div>
        </main>

        <div class="backgroundwhite-bottom">
            <img src="../assets/backgroundwhite-bottom.png" alt="Decoración inferior">
        </div>

        <!-- Modal para usuario existente -->
        <div class="modal-overlay" id="modal-usuario-existente">
            <div class="modal-content">
                <h2>Registro ya existente</h2>
                <p>Usuario ya registrado intente cambiar los datos</p>
                <button class="modal-btn" id="btn-aceptar">Aceptar</button>
            </div>
        </div>
            <!-- Modal para asociación fallida por "test" -->
    <div class="modal-overlay" id="modal-asociacion-fallida">
        <div class="modal-content">
            <h2>Error en la asociación</h2>
            <p>Usuario no encontrado</p>
            <button class="modal-btn" id="btn-aceptar-asociacion">Aceptar</button>
        </div>
    </div>
      <!-- Modal para asociación  -->
   <!-- Modal para asociación  -->
<div class="modal-overlay2" id="modal-user-exito">
    <div class="modal-content">
        <h2>Usuario encontrado</h2>
        <p>Inserte el número de placa a asociar</p>

        <div class="campoplaca">
            <label for="placa">Placa</label>
            <input type="text" id="placa" name="placa" required>
            <div id="error-placa" class="mensaje-error" style="display: none;">Error, número de placas no válido</div>
        </div>

        <button class="modal-btn" id="btn-asociar">Asociar</button>
    </div>
</div>
<!-- Modal de Asociación Exitosa -->
<div class="modal-overlay3" id="modal-exito-final">
    <div class="modal-content">
        <h2>¡Asociación exitosa!</h2>
        <p id="texto-exito">Nombre: <br>Matrícula: <br>Placas: </p>
        <button class="modal-btn" id="btn-aceptar-final">Aceptar</button>
    </div>
</div>


        <!-- Script para asegurar que la onda inferior se muestre correctamente -->
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                // Asegurar que el layout tenga altura completa
                const layout = document.querySelector('.layout');
                const vh = window.innerHeight;
                layout.style.minHeight = vh + 'px';

                // Asegurar que la onda inferior sea visible
                const bottomWave = document.querySelector('.backgroundwhite-bottom');
                bottomWave.style.display = 'block';
            });
        </script>
    </div>
    <script src="../js/asociarplacasvehiculo.js"></script>
</body>

</html>
